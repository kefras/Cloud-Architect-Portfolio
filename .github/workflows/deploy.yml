name: Validate and Deploy Portfolio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and validation tools
        run: python -m pip install -r tools/requirements.txt

      - name: Generate and validate the current site
        run: |
          python tools/build.py
          python tests/validate.py
          python -m compileall -q tools
          for file in script.js theme.js js/*.js; do
            node --check "$file"
          done

      - name: Check the deployment package
        run: python tools/package_site.py

      - name: Save the validated website
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: public-dist/
          if-no-files-found: error

  deploy:
    needs: validate
    # Pull requests validate source without accessing production credentials.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated website
        uses: actions/download-artifact@v4
        with:
          name: portfolio-static-site
          path: public-dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy the complete static site to S3
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        # Do not sync the repository root or delete unowned remote objects.
        run: |
          test -n "$S3_BUCKET_NAME"
          aws s3 sync public-dist/ "s3://$S3_BUCKET_NAME/" --no-progress
