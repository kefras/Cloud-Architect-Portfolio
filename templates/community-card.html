<article class="involvement-card" tabindex="0" aria-labelledby="${community_id}-title" aria-describedby="${community_id}-description">
  <div class="community-card-heading">
    <span class="card-icon">${robotics_icon}</span>
    <span class="status">${role}</span>
  </div>
  <p class="eyebrow">${institution}</p>
  <h3 id="${community_id}-title">${name}</h3>
  <p id="${community_id}-description" class="muted">${description}</p>
  <ul class="tags" aria-label="Community focus areas">${focus_badges}</ul>
</article>
