<article class="credential-card">
  <div class="card-icon">${icon}</div>
  <p class="eyebrow">${kind}</p>
  <h3>${name}</h3>
  <p>${issuer}</p>
  <p class="small muted">${date}</p>
  <p class="small muted">Issued to ${recipient}</p>
  <a class="text-link" href="${verification_url}">Verify credential ↗</a>
</article>
